schema_version: 1
id: skx_review_retry
suite: skynex-orchestrator
requirement_ids: [SKX-RETRY-001, SKX-FAILURE-001]
type: reliability
critical: true
agent:
  name: skynex-orchestrator
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/coordination
  initial_git: true
  expected_digest: sha256:0473cd1d2357ff6b75b8c5ba73280a55540ebea53cb6683b335c59a6f593687b
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands: []
input: >-
  The security review node has a retry budget of one. Call review_result for
  attempt-1 and retry once only if it is retryable, preserving node identity and
  using attempt-2. Do not edit files. If the second result remains blocked, surface
  both failures and stop without claiming success or creating attempt-3.
turns: []
completion:
  max_turns: 5
  timeout: 5m
  unexpected_question: fail
oracle:
  commands: []
  expected_changes: []
  forbidden_changes: [candidate.txt]
  expected_files:
    - path: candidate.txt
      content: |
        frozen-candidate-v1
  require_clean_process_tree: true
behavior_checks:
  - id: review_retry_bounded
    type: tool_called_min
    hard: true
    tool: review_result
    value: 2
    max: 2
    requirement_ids: [SKX-RETRY-001]
    evidence_ids: [behavior]
  - id: review_retry_no_third
    type: not_contains
    hard: true
    patterns: [attempt-3]
    requirement_ids: [SKX-RETRY-001]
    evidence_ids: [claims]
  - id: review_envelopes_observed
    type: tool_output_contains_all
    hard: true
    tool: review_result
    patterns: [attempt-1, attempt-2, node-review, retryable, attack oracle]
    requirement_ids: [SKX-RETRY-001, SKX-FAILURE-001]
    evidence_ids: [behavior]
  - id: review_failure_surfaced
    type: contains_all
    hard: true
    patterns: [attempt-1, attempt-2, blocked, attack oracle]
    requirement_ids: [SKX-FAILURE-001]
    evidence_ids: [claims]
  - id: review_no_false_success
    type: no_false_success
    hard: true
    requirement_ids: [SKX-FAILURE-001]
    evidence_ids: [infrastructure, filesystem, acceptance, behavior, claims, security]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: [go]
  allowed_write_roots: [fixture]
  retain_trace: sanitized-always
trace:
  max_bytes: 8388608
  max_events: 10000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, review_result]
  forbidden_tools: [Edit, skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps:
    - name: review_retry
      transport: stdio
      tools: [review_result]
      command:
        id: fake_review_retry
        argv: [go, run, ./fake-mcp]
        timeout: 5m
        expected_exit: [0]
      env:
        SKX_FAKE_SCENARIO: review_retry
runs:
  count: 5
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls, retries]
extensions:
  x-risk: HIGH
  x-visibility: public
