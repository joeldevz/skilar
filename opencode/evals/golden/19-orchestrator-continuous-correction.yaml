name: orchestrator-continues-actionable-correction-without-permission-loop
prompt: A managed notification says migration-forward is replan_required with a confirmed actionable migration finding. Continue the workflow.
must_include:
  - workflow status
  - workflow inspect
  - verify the evidence
  - derived corrective workflow
  - skynex workflow start
  - skynex workflow run
  - --detach
must_not_include:
  - shall I
  - do you want me to
  - skynex workflow approve
  - skynex workflow deliver
  - git commit
  - git push
  - gh pr
