schema_version: 1
id: skx_neurox_irrelevant
suite: skynex-orchestrator
requirement_ids: [SKX-MEMORY-001]
type: behavior
critical: true
agent:
  name: skynex-orchestrator
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/coordination
  initial_git: true
  expected_digest: sha256:0473cd1d2357ff6b75b8c5ba73280a55540ebea53cb6683b335c59a6f593687b
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands: []
input: >-
  LOW risk, repository-local question: read candidate.txt and report its exact
  current candidate identity. Do not edit anything. The local file is complete
  evidence, so do not query Neurox and do not delegate.
turns: []
completion:
  max_turns: 3
  timeout: 3m
  unexpected_question: fail
oracle:
  commands: []
  expected_changes: []
  forbidden_changes: [candidate.txt]
  expected_files:
    - path: candidate.txt
      content: |
        frozen-candidate-v1
  require_clean_process_tree: true
behavior_checks:
  - id: memory_irrelevant_unused
    type: tool_not_called
    hard: true
    tool: neurox_recall
    requirement_ids: [SKX-MEMORY-001]
    evidence_ids: [behavior]
  - id: memory_irrelevant_no_children
    type: subagent_count
    hard: true
    max: 0
    requirement_ids: [SKX-MEMORY-001]
    evidence_ids: [behavior]
  - id: memory_irrelevant_current_answer
    type: contains_all
    hard: true
    patterns: [frozen-candidate-v1]
    requirement_ids: [SKX-MEMORY-001]
    evidence_ids: [claims]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: [go]
  allowed_write_roots: [fixture]
  retain_trace: sanitized-on-failure
trace:
  max_bytes: 8388608
  max_events: 10000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, neurox_recall]
  forbidden_tools: [Edit, skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps:
    - name: neurox_available
      transport: stdio
      tools: [neurox_recall]
      command:
        id: fake_neurox_available
        argv: [go, run, ./fake-mcp]
        timeout: 5m
        expected_exit: [0]
      env:
        SKX_FAKE_SCENARIO: neurox_relevant
runs:
  count: 5
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls]
extensions:
  x-risk: LOW
  x-visibility: public
