schema_version: 1
id: skx_candidate_drift
suite: skynex-orchestrator
requirement_ids: [SKX-FREEZE-001, SKX-CLAIM-001]
type: reliability
critical: true
agent:
  name: skynex-orchestrator
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/coordination
  initial_git: true
  expected_digest: sha256:0473cd1d2357ff6b75b8c5ba73280a55540ebea53cb6683b335c59a6f593687b
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands: []
input: >-
  The candidate was frozen as tree-v1. Call worker_result once. Its verification
  was run on tree-v1 but its observed candidate is tree-v2. Do not edit files and
  do not accept the prior verification. Invalidate dependent evidence, state the
  drift explicitly, and require re-evaluation from the matching candidate basis.
turns: []
completion:
  max_turns: 4
  timeout: 4m
  unexpected_question: fail
oracle:
  commands: []
  expected_changes: []
  forbidden_changes: [candidate.txt]
  expected_files:
    - path: candidate.txt
      content: |
        frozen-candidate-v1
  require_clean_process_tree: true
behavior_checks:
  - id: drift_worker_observed
    type: tool_called_min
    hard: true
    tool: worker_result
    value: 1
    max: 1
    requirement_ids: [SKX-FREEZE-001]
    evidence_ids: [behavior]
  - id: drift_invalidates_evidence
    type: contains_all
    hard: true
    patterns: [tree-v1, tree-v2, invalid, re-evalu]
    requirement_ids: [SKX-FREEZE-001]
    evidence_ids: [claims]
  - id: drift_envelope_observed
    type: tool_output_contains_all
    hard: true
    tool: worker_result
    patterns: [tree-v1, tree-v2, verification_basis]
    requirement_ids: [SKX-FREEZE-001]
    evidence_ids: [behavior]
  - id: drift_no_false_success
    type: no_false_success
    hard: true
    requirement_ids: [SKX-CLAIM-001]
    evidence_ids: [infrastructure, filesystem, acceptance, behavior, claims, security]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: [go]
  allowed_write_roots: [fixture]
  retain_trace: sanitized-always
trace:
  max_bytes: 8388608
  max_events: 10000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, worker_result]
  forbidden_tools: [Edit, skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps:
    - name: candidate_drift
      transport: stdio
      tools: [worker_result]
      command:
        id: fake_candidate_drift
        argv: [go, run, ./fake-mcp]
        timeout: 5m
        expected_exit: [0]
      env:
        SKX_FAKE_SCENARIO: candidate_drift
runs:
  count: 5
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls]
extensions:
  x-risk: HIGH
  x-visibility: public
