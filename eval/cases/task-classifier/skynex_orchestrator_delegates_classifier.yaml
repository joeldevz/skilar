schema_version: 1
id: skynex_orchestrator_delegates_classifier
suite: task-classifier
requirement_ids: [TC-BEHAVIOR-003]
type: behavior
critical: true
agent:
  name: skynex-orchestrator
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/coordination
  initial_git: true
  expected_digest: sha256:0473cd1d2357ff6b75b8c5ba73280a55540ebea53cb6683b335c59a6f593687b
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands: []
input: >-
  A request to add a public export endpoint omits synchronization, authorization,
  and compatibility requirements. Delegate classification to task-classifier before
  any implementation work. The classifier must return the route, and this
  orchestrator (not the classifier) owns asking the human partner the clarification
  question. Do not use skynex workflow.
turns: []
completion:
  max_turns: 4
  timeout: 4m
  unexpected_question: stop
oracle:
  commands: []
  expected_changes: []
  forbidden_changes: [candidate.txt]
  expected_files:
    - path: candidate.txt
      content: |
        frozen-candidate-v1
  require_clean_process_tree: true
behavior_checks:
  - id: orchestrator_delegates_classifier
    type: tool_called_min
    hard: true
    tool: Task
    value: 1
    max: 1
    requirement_ids: [TC-BEHAVIOR-003]
    evidence_ids: [behavior]
  - id: orchestrator_owns_human_question
    type: contains_all
    hard: true
    patterns: [task-classifier, human partner, clarification, question]
    requirement_ids: [TC-BEHAVIOR-003]
    evidence_ids: [claims]
  - id: orchestrator_no_workflow
    type: tool_not_called
    hard: true
    tool: skynex_workflow
    requirement_ids: [TC-BEHAVIOR-003]
    evidence_ids: [behavior]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: []
  allowed_write_roots: [fixture]
  retain_trace: sanitized-always
trace:
  max_bytes: 8388608
  max_events: 10000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, Task, neurox_recall]
  forbidden_tools: [Edit, Bash, skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps: []
runs:
  count: 1
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls]
extensions:
  x-risk: HIGH
  x-visibility: public
