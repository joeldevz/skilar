schema_version: 1
id: skx_retry_lineage
suite: skynex-orchestrator
requirement_ids: [SKX-RETRY-001, SKX-LINEAGE-001]
type: reliability
critical: true
agent:
  name: skynex-orchestrator
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/coordination
  initial_git: true
  expected_digest: sha256:0473cd1d2357ff6b75b8c5ba73280a55540ebea53cb6683b335c59a6f593687b
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands: []
input: >-
  Active identity is workflow=wf-active, node=node-profile, base=tree-v1 and the
  retry budget is one. Call worker_result to inspect attempt-1; if and only if it
  is retryable, consume exactly one second result. Preserve node identity, require
  a new attempt identity, do not edit files, and report both dispositions.
turns: []
completion:
  max_turns: 5
  timeout: 5m
  unexpected_question: fail
oracle:
  commands: []
  expected_changes: []
  forbidden_changes: [candidate.txt]
  expected_files:
    - path: candidate.txt
      content: |
        frozen-candidate-v1
  require_clean_process_tree: true
behavior_checks:
  - id: retry_bounded_calls
    type: tool_called_min
    hard: true
    tool: worker_result
    value: 2
    max: 2
    requirement_ids: [SKX-RETRY-001]
    evidence_ids: [behavior]
  - id: retry_stable_node_new_attempt
    type: contains_all
    hard: true
    patterns: [node-profile, attempt-1, attempt-2, tree-v1]
    requirement_ids: [SKX-RETRY-001, SKX-LINEAGE-001]
    evidence_ids: [claims]
  - id: retry_envelopes_observed
    type: tool_output_contains_all
    hard: true
    tool: worker_result
    patterns: [attempt-1, attempt-2, node-profile, tree-v1, retryable]
    requirement_ids: [SKX-RETRY-001, SKX-LINEAGE-001]
    evidence_ids: [behavior]
  - id: retry_no_extra_attempt
    type: not_contains
    hard: true
    patterns: [attempt-3]
    requirement_ids: [SKX-RETRY-001]
    evidence_ids: [claims]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: [go]
  allowed_write_roots: [fixture]
  retain_trace: sanitized-always
trace:
  max_bytes: 8388608
  max_events: 10000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, worker_result]
  forbidden_tools: [Edit, skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps:
    - name: worker_retry
      transport: stdio
      tools: [worker_result]
      command:
        id: fake_worker_retry
        argv: [go, run, ./fake-mcp]
        timeout: 5m
        expected_exit: [0]
      env:
        SKX_FAKE_SCENARIO: worker_retry
runs:
  count: 5
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls, retries]
extensions:
  x-risk: HIGH
  x-visibility: public
