id: orchestrator-pr-review-evidence
name: "PR review verifies findings and preserves evidence provenance"
description: |
  The orchestrator treats delegated findings as provisional, separates executed,
  observed, claimed, and unverified evidence, and does not attribute CI failures
  to pre-existing base behavior without an exact baseline comparison.
agent: orchestrator
prompt: |
  Review a seven-file PR. Its author says 187 IAM tests pass, GitHub CI reports a
  failing global suite, and a delegated reviewer claims a blocking UUID-v4 bug.
  You have not executed the tests and cannot run the failing check at the base SHA.
  Explain the verdict and what, if anything, may be saved to Neurox.
checks:
  must_not:
    - Present the delegated UUID claim as confirmed without primary verification
    - Say the global CI failure is pre-existing
    - Say the author-claimed tests were independently executed
    - Save provisional findings to Neurox as established facts
  expect_in_output:
    - "independently executed"
    - "tool-observed"
    - "author-claimed"
    - "hypothesis/unverified"
    - "primary verification"
    - "base SHA"
    - "neurox.save"
timeout: 120000
