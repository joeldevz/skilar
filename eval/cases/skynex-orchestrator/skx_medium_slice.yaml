schema_version: 1
id: skx_medium_slice
suite: skynex-orchestrator
requirement_ids: [SKX-RISK-MED-001, SKX-LINEAGE-001]
type: behavior
critical: true
agent:
  name: skynex-orchestrator
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/medium-profile
  initial_git: true
  expected_digest: sha256:33a80672477350b7988e109d8d8452c49f76b1886d5fd4773612516c135acf41
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands:
    - id: setup_red
      argv: [go, test, ./...]
      timeout: 1m
      expected_exit: [1]
input: >-
  MEDIUM risk. Implement NormalizeProfile while keeping the public Profile shape
  unchanged. The work is one bounded implementation slice, so use exactly one
  implementation child. Accept its code result only with matching workflow, node,
  attempt, base-candidate, scope, and verification identities. Require the child
  result itself to report workflow_id, node_id, attempt_id, base_candidate, scope,
  and evidence; then verify locally.
turns: []
completion:
  max_turns: 6
  timeout: 6m
  unexpected_question: fail
oracle:
  commands:
    - id: oracle_green
      argv: [go, test, ./...]
      timeout: 1m
      expected_exit: [0]
      max_output_bytes: 1048576
  expected_changes: [normalize.go]
  forbidden_changes: [normalize_test.go, profile.go, go.mod]
  expected_files:
    - path: go.mod
      content: |
        module example.com/skx/mediumprofile

        go 1.25
  require_clean_process_tree: true
behavior_checks:
  - id: medium_single_slice
    type: subagent_count
    hard: true
    min: 1
    max: 1
    patterns: [workflow_id, node_id, attempt_id, base_candidate, scope, evidence]
    requirement_ids: [SKX-RISK-MED-001, SKX-LINEAGE-001]
    evidence_ids: [behavior]
  - id: medium_verified_result
    type: no_false_success
    hard: true
    requirement_ids: [SKX-LINEAGE-001]
    evidence_ids: [infrastructure, filesystem, acceptance, behavior, claims, security]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: [go]
  allowed_write_roots: [fixture]
  retain_trace: sanitized-on-failure
trace:
  max_bytes: 16777216
  max_events: 20000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, Edit, Bash, Task]
  forbidden_tools: [skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps: []
runs:
  count: 5
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls]
extensions:
  x-risk: MEDIUM
  x-visibility: public
