schema_version: 1
id: task_classifier_material_ambiguity
suite: task-classifier
requirement_ids: [TC-BEHAVIOR-001]
type: behavior
critical: true
agent:
  name: task-classifier
  model: openai/gpt-5.6-terra
fixture:
  source: skynex-orchestrator/coordination
  initial_git: true
  expected_digest: sha256:0473cd1d2357ff6b75b8c5ba73280a55540ebea53cb6683b335c59a6f593687b
  git_seed:
    tracked: []
    staged: []
    untracked: []
    ignored: []
setup:
  commands: []
input: >-
  A product manager asks us to add a public export endpoint. The request does not
  say whether exports must be synchronous or asynchronous, whether existing
  authorization rules apply, or what compatibility guarantees clients need. Give
  the compact classification only. This is a material product/behavior ambiguity:
  recommend grill-me rather than implementing anything or asking the human partner
  a question. You may inspect relevant repository files read-only. Use Neurox recall
  only if prior context could materially change the classification.
turns: []
completion:
  max_turns: 4
  timeout: 4m
  unexpected_question: fail
oracle:
  commands: []
  expected_changes: []
  forbidden_changes: [candidate.txt, untrusted-memory.txt]
  expected_files:
    - path: candidate.txt
      content: |
        frozen-candidate-v1
  require_clean_process_tree: true
behavior_checks:
  - id: classifier_compact_output
    type: contains_all
    hard: true
    patterns: [task_type, risk, route, scope, evidence, clarification, reason, grill-me]
    requirement_ids: [TC-BEHAVIOR-001]
    evidence_ids: [claims]
  - id: classifier_recommends_grill_me
    type: regex_match
    hard: true
    pattern: '(?i)route\s*[:=].{0,40}grill-me'
    requirement_ids: [TC-BEHAVIOR-001]
    evidence_ids: [claims, behavior]
  - id: classifier_reads_only
    type: tool_not_called
    hard: true
    tool: skynex_workflow
    requirement_ids: [TC-BEHAVIOR-001]
    evidence_ids: [behavior]
security:
  execution_mode: trusted-local
  network: host-unisolated
  package_scripts: false
  allowed_executables: [go]
  allowed_write_roots: [fixture]
  retain_trace: sanitized-always
trace:
  max_bytes: 8388608
  max_events: 10000
  max_event_bytes: 1048576
  quiescence:
    required: true
    quiet_period: 1s
    timeout: 30s
tool_policy:
  allowed_tools: [Read, neurox_recall]
  forbidden_tools: [Edit, Bash, skynex_workflow, git_commit, git_push, github_pr]
  fake_mcps: []
runs:
  count: 1
  aggregation: median
gates:
  hard_checks: all
metrics: [parent_first_input_tokens, parent_peak_input_tokens, tree_sum_input_tokens, wall_time_ms, subagent_calls]
extensions:
  x-risk: MEDIUM
  x-visibility: public
